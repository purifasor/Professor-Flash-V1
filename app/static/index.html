<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professor Flash V1 - AI App Builder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- ======================= header ======================= -->
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13 2 L4.5 13.5 H11 L9.5 22 L19.5 9.5 H12.5 L13 2 Z" fill="url(#lg)"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="24" y2="24">
          <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
        </linearGradient></defs>
      </svg>
      <div class="brand-text">
        <h1>Professor Flash</h1>
        <span>V1 · AI App Builder</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="badge" id="modelBadge" title="آفلاین و رایگان">
        <span class="dot"></span>
        <span id="badgeText">آفلاین · رایگان</span>
      </div>
      <button class="icon-btn hidden" id="btnPause" title="توقف موقت">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button class="icon-btn accent hidden" id="btnResume" title="ادامه">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5L7 4.5z"/></svg>
      </button>
      <button class="icon-btn danger hidden" id="btnStop" title="توقف کامل">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="btnPane" title="پنل کار">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ======================= main layout ======================= -->
  <main class="layout" id="layout">

    <section class="chat-pane" id="chatPane">
      <div class="chat-log" id="chatLog"></div>
      <div class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" dir="auto" placeholder="به Professor Flash بگو چه برنامه‌ای بسازد..."></textarea>
          <div class="composer-bar">
            <span class="hint">Enter ارسال · Shift+Enter خط جدید</span>
            <button class="btn-send" id="btnSend">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 20.85 12 3.4 3.6l.01 6.53L15 12 3.41 13.87l-.01 6.53z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <aside class="work-pane" id="workPane" hidden>
      <div class="work-head">
        <span class="work-title" id="workTitle">محیط کار</span>
        <span class="work-state" id="workState"></span>
      </div>
      <div class="work-tabs">
        <button class="tab active" data-tab="todo">وظایف</button>
        <button class="tab" data-tab="log">گزارش</button>
        <button class="tab" data-tab="files">فایل‌ها</button>
      </div>
      <div class="tab-body" id="tab-todo">
        <ul class="todo-list" id="todoList"></ul>
      </div>
      <div class="tab-body hidden" id="tab-log">
        <div class="log-box" id="logList"></div>
      </div>
      <div class="tab-body hidden" id="tab-files">
        <ul class="file-list" id="fileList"></ul>
      </div>
    </aside>
  </main>

  <!-- ======================= preview ======================= -->
  <section class="preview-zone" id="previewZone" hidden>
    <div class="preview-bar">
      <span class="preview-title" id="previewTitle">پیش‌نمایش</span>
      <div class="preview-actions">
        <button class="mini-btn" id="btnOpenPreview">باز کردن در تب جدید</button>
        <button class="mini-btn ghost" id="btnClosePreview">بستن</button>
      </div>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="previewFrame" title="پیش‌نمایش پروژه"></iframe>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
