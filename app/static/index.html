<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professor Flash V1</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">

  <!-- ============ sidebar: history ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="btn btn-ghost new-session" id="btnNewSession" title="گفتگوی جدید">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>گفتگوی جدید</span>
      </button>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="sidebar-foot">
      <div class="brain-badge" id="brainBadge">
        <span class="dot" id="brainDot"></span>
        <span id="brainText">در حال اتصال...</span>
      </div>
    </div>
  </aside>

  <!-- ============ main: chat ============ -->
  <main class="main">
    <header class="topbar">
      <div class="brand">
        <div class="logo">PF</div>
        <div>
          <div class="brand-name">Professor Flash <span class="version">V1</span></div>
          <div class="brand-sub" id="brandSub">Agent هوش مصنوعی - فکر می‌کند، می‌سازد، یاد می‌گیرد</div>
        </div>
      </div>
      <div class="topbar-info">
        <div class="chip" id="learnedChip" title="دانش ذخیره‌شده در پوشه Learned">یادگیری: ۰</div>
        <div class="chip chip-path" id="pathChip" title="محل ذخیره پروژه‌ها">projects/</div>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat" id="chat"></div>

      <!-- hero / empty state -->
      <div class="hero" id="hero">
        <div class="hero-logo">PF</div>
        <h1 class="hero-title">Professor Flash V1</h1>
        <p class="hero-sub">یک Agent هوش مصنوعی واقعی، رایگان و آفلاین-اول. هر پیام را می‌فهمد، فکر می‌کند و پاسخ واقعی می‌سازد.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <!-- composer -->
    <div class="composer-wrap">
      <div class="controls" id="controls" hidden>
        <button class="btn ctrl" id="btnPause" title="توقف موقت">
          <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span>توقف موقت</span>
        </button>
        <button class="btn ctrl" id="btnResume" title="ادامه">
          <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>
          <span>ادامه</span>
        </button>
        <button class="btn ctrl danger" id="btnStop" title="توقف کامل">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span>توقف کامل</span>
        </button>
        <span class="task-state" id="taskState"></span>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="بنویس: سوال، درخواست ساخت برنامه، یا محاسبه... (Shift+Enter برای خط جدید)" dir="auto"></textarea>
        <button class="btn send" id="btnSend" title="ارسال">
          <svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- ============ sandbox: logs / todos / files ============ -->
  <aside class="sandbox" id="sandbox">
    <div class="sandbox-head">
      <span>Sandbox</span>
      <span class="task-status" id="taskStatus">آماده</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="logs">گزارش</button>
      <button class="tab" data-tab="todos">وظایف</button>
      <button class="tab" data-tab="files">فایل‌ها</button>
    </div>
    <div class="tab-body" id="tab-logs">
      <div class="logs" id="logs"></div>
    </div>
    <div class="tab-body" id="tab-todos" hidden>
      <div class="todos" id="todos"></div>
    </div>
    <div class="tab-body" id="tab-files" hidden>
      <div class="files" id="files"></div>
    </div>
  </aside>

</div>

<script src="/js/app.js"></script>
</body>
</html>
