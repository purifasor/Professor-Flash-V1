<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professor Flash V1 - چت</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="chat">

<div class="app">

  <!-- ============ sidebar: history ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="btn btn-ghost new-session" id="btnNewSession" title="گفتگوی جدید">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>گفتگوی جدید</span>
      </button>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="sidebar-foot">
      <div class="brain-badge" id="brainBadge">
        <span class="dot" id="brainDot"></span>
        <span id="brainText">در حال اتصال...</span>
      </div>
    </div>
  </aside>

  <!-- ============ main: chat ============ -->
  <main class="main">
    <header class="topbar">
      <div class="brand">
        <div class="logo">PF</div>
        <div>
          <div class="brand-name">Professor Flash <span class="version">V1</span></div>
          <div class="brand-sub" id="brandSub">چت - گفتگو، سوال و کد بدون ساخت فایل</div>
        </div>
      </div>
      <nav class="nav-tabs">
        <a class="nav-tab active" href="/">چت</a>
        <a class="nav-tab" href="/agent">Agent</a>
      </nav>
      <div class="topbar-info">
        <div class="chip" id="learnedChip" title="دانش ذخیره‌شده در پوشه Learned">یادگیری: ۰</div>
        <div class="chip chip-path" id="pathChip" title="محل ذخیره پروژه‌ها">projects/</div>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <button class="scroll-down" id="btnScrollDown" hidden title="برو به پایین">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="chat" id="chat"></div>

      <!-- hero / empty state -->
      <div class="hero" id="hero">
        <div class="hero-logo">PF</div>
        <h1 class="hero-title">Professor Flash V1</h1>
        <p class="hero-sub">چت: هر پیامی را می‌فهمد، فکر می‌کند و پاسخ واقعی می‌سازد - بدون ساخت فایل. برای ساخت برنامه به تب Agent برو.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <!-- composer -->
    <div class="composer-wrap">
      <div class="controls" id="controls" hidden>
        <button class="btn ctrl" id="btnPause" title="توقف موقت">
          <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span>توقف موقت</span>
        </button>
        <button class="btn ctrl" id="btnResume" title="ادامه">
          <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>
          <span>ادامه</span>
        </button>
        <button class="btn ctrl danger" id="btnStop" title="توقف کامل">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span>توقف کامل</span>
        </button>
        <span class="task-state" id="taskState"></span>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="بنویس: سوال، درخواست کد، یا محاسبه... (Shift+Enter برای خط جدید)" dir="auto"></textarea>
        <button class="btn search" id="btnSearch" title="جستجو در وب">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="btn send" id="btnSend" title="ارسال">
          <svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </main>

</div>

<script src="/js/app.js"></script>
</body>
</html>
