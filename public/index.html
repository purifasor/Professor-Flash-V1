<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professor Flash V1 - چت</title>
<link rel="icon" type="image/png" href="/img/logo-64.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="chat">

<div class="app">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ============ sidebar: history ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="btn btn-ghost new-session" id="btnNewSession" title="گفتگوی جدید">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>گفتگوی جدید</span>
      </button>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="sidebar-foot">
      <div class="brain-badge" id="brainBadge">
        <span class="dot" id="brainDot"></span>
        <span id="brainText">در حال اتصال...</span>
      </div>
    </div>
  </aside>

  <!-- ============ main: chat ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-start">
      <button class="btn btn-ghost burger" id="btnBurger" title="باز و بسته کردن هیستوری" aria-label="منو">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand" id="brandBlock">
        <div class="logo"><img src="/img/logo-128.png" alt="Professor Flash"></div>
        <div>
          <div class="brand-name">Professor Flash <span class="version">V1</span></div>
          <div class="brand-sub" id="brandSub">PRF - فکر می‌کند، جواب می‌دهد</div>
        </div>
      </div>
      </div>
      <div class="topbar-info">
        <div class="chip" id="learnedChip" title="دانش ذخیره‌شده در پوشه Learned">یادگیری: ۰</div>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat" id="chat"></div>

      <!-- hero / empty state -->
      <div class="hero" id="hero">
        <div class="hero-logo"><img src="/img/logo-256.png" alt="Professor Flash"></div>
        <h1 class="hero-title">Professor Flash V1</h1>
        <p class="hero-sub">هر پیامی را می‌فهمد، فکر می‌کند و پاسخ واقعی می‌سازد - بدون ساخت فایل.</p>
      </div>
    </div>

    <!-- composer -->
    <div class="composer-wrap">
      <div class="composer-rail">
        <div class="wait-progress" id="waitProgress" hidden>
          <div class="wait-track"><div class="wait-fill" id="waitFill"></div></div>
          <span class="wait-label" id="waitLabel">0%</span>
          <span class="wait-phase" id="waitPhase">در حال ارسال...</span>
        </div>
        <button class="scroll-down" id="btnScrollDown" hidden title="برو به آخرین پیام">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          برو به آخر
        </button>
      </div>
      <div class="controls" id="controls" hidden>
        <button class="btn ctrl" id="btnPause" title="توقف موقت">
          <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span>توقف موقت</span>
        </button>
        <button class="btn ctrl" id="btnResume" title="ادامه">
          <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>
          <span>ادامه</span>
        </button>
        <button class="btn ctrl danger" id="btnStop" title="توقف کامل">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span>توقف کامل</span>
        </button>
        <span class="task-state" id="taskState"></span>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="بنویس: سوال، درخواست کد، یا محاسبه... (Shift+Enter برای خط جدید)" dir="auto"></textarea>
        <button class="btn send" id="btnSend" title="ارسال">
          <svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- page switch: outside the chat area, bottom-left; Agent disabled for now -->
  <div class="page-switch" id="pageSwitch">
    <a class="ps-item active" href="/">چت</a>
    <span class="ps-item disabled" id="psAgent" title="به‌زودی">Agent</span>
  </div>

</div>

<script src="/js/app.js"></script>
</body>
</html>
